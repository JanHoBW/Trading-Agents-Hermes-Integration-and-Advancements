# ============================================================================
# Hand-curated (hardcoded) sources for the TradingAgents news pipeline.
# ----------------------------------------------------------------------------
# MENSCHENLESBAR & EDITIERBAR — einfach Einträge ergänzen, kein Code nötig.
# Diese Datei wächst über die Zeit; neue Ticker/Foren/Feeds hier anlegen.
#
# Gelesen von:
#   * scripts/news_sources/de_feeds.py (via news_collect.py) -> feeds + forums (deutsche Portale)
#   * scripts/run_analysis.py -> ticker-Metadaten (names, isin, sector; load_ticker_meta)
#   * tradingagents/dataflows/vendors/reddit.py
#       -> reddit-Overrides, via Env TRADINGAGENTS_REDDIT_OVERRIDES
#          (wird von run_analysis.py automatisch gesetzt)
#
# Feed-Status geprüft am 2026-10-16 von diesem Host:
#   tagesschau, finanzmarktwelt, n-tv ................ OK
#   hartpunkt.de (Drohnen-/Rüstungs-Nachrichten) .... OK (Wartungs-Feed, RSS 2.0)
#   esut.de (ESUT-Magazin, Mittler Report Verlag) .... OK (RSS 2.0, 6 Items)
#   finanzen.net ................................ Akamai blockt Datacenter-IPs (403) -> disabled
#   boerse.de / wallstreet-online .............. kein nutzbares öffentliches RSS von hier -> disabled
#
# Slot-Reihenfolge im de-Snapshot (seit 2026-10-22):
#   1. Namens-Treffer (alle Feeds)               unbegrenzt bis --max
#   2. Fachquellen (`all_items: true`)           Budget --fach-max (10)
#   3. Sektor-Kontext ([Sektor]-Tag)             Budget --sector-max (5)
#   4. Forum-Posts                               Budget --forum-max (3), zuletzt
# Supplement-Deckel: --max 30 (Vendor-Limit in
# tradingagents/dataflows/vendors/news_supplement.py, byte-Deckel 100 KB).
# ============================================================================
version: 1

sectors:
  energy:
    keywords: ["Siemens Energy", "Siemens Gamesa", "Energiewende", "Stromnetz",
               "Netzausbau", "Gasturbine", "Windkraft", "Offshore", "HGÜ",
               "Umspannwerk", "Elektrolyse", "Wasserstoff", "Kraftwerk"]
    max_items: 5
  defense:
    # Sektor-Kontext: News zu diesen Begriffen werden zusätzlich gesammelt
    # (max. --sector-max Items pro Run, als [Sektor] markiert).
    # Zwei Gruppen: Firmennamen (Kurs-Treiber direkt) + Fähigkeits-/Beschaffungs-
    # begriffe. Ohne die zweite Gruppe fällt capability-News durch den Filter,
    # die keinen börsennotierten Namen im Titel trägt (Fregatten, Drohnenabwehr,
    # Weltraum, Artillerie) — genau der Vorlauf, der Defense-Werte bewegt.
    keywords:
      # --- Emittenten ---
      - Rheinmetall
      - Hensoldt
      - Airbus
      - OHB
      - "Krauss-Maffei"
      - KMW
      - Diehl
      - Renk
      - Aris
      - Eurodrone
      - MBDA
      - Safran
      - Thales
      - Leonardo
      - BAE Systems
      - Kongsberg
      - Saab
      - "Lockheed"
      - "Raytheon"
      - "RTX"
      - "Northrop"
      # --- Fähigkeiten / Beschaffung ---
      - Drohne
      - "unbemannt"
      - Fregatte
      - Korvette
      - Marine
      - Luftwaffe
      - Heer
      - Bundeswehr
      - BAAINBw
      - NATO
      - Beschaffung
      - Rüstung
      - Lenkflugkörper
      - Marschflugkörper
      - Flugabwehr
      - Drohnenabwehr
      - Artillerie
      - Weltraum
      - Satellit
      - Patriot
      - Skyranger
      - IRIS-T
      - HIMARS
      - Tomahawk
      - Leopard
      - Puma

tickers:
  RHM.DE:
    names: [Rheinmetall]          # Suchbegriffe für Feed-Filter + Reddit
    isin: DE0007030009            # verifiziert: DPA-Feed-Tag (WKN 703000)
    sector: defense               # optionaler Sektor-Kontext (siehe sectors)
    forums:                       # hand-curated Forum-Threads (HTML-Parsing)
      - label: "BörsenNEWS Rheinmetall – Aktionäre und Investoren"
        url: "https://www.boersennews.de/community/diskussion/rheinmetall-aktionaere-und-investoren/92438/?r=410#userComments"
    reddit:                       # Overrides für den Reddit-Vendor
      queries: [Rheinmetall]      # zusätzliche Suchbegriffe neben dem Ticker
      subreddits:                 # geprüft 2026-10-19 (Reddit-Site-Suche, letzte Woche):
        - wallstreetbetsGER       #   ~20 RHM-Posts/Woche (DE-Mirror von WSB)
        - RHM_Rheinmetall         #   dediziertes Sub inkl. Weekly-RHM-Thread
                                  # Default-US-Subs (wallstreetbets/stocks/investing): 0 RHM-Hits
  ENR.DE:
    names: [Siemens Energy, Siemens Energy AG]
    isin: DE000ENER6Y0            # verifiziert: Chart-Widget der IR-Seite (WKN ENER6Y)
    sector: energy
    reddit:
      queries: [Siemens Energy]
      subreddits: [wallstreetbetsGER, Aktien]
  # Portfolio-Bestand A40Y9K (WisdomTree Europe Defence). ISIN verifiziert am
  # 2026-10-30 über WisdomTree-Produktseite + justETF (WKN A40Y9K, Xetra EUDF).
  # ETF-Profil und Top-10-Holdings kommen aus den Yahoo-Funds-Daten.
  EUDF.DE:
    names: [WisdomTree Europe Defence, Europe Defence ETF]
    isin: IE0002Y8CX98
    sector: defense
    reddit:
      queries: [WisdomTree Europe Defence, Europe Defence ETF]
  # US-Titel: ISIN bewusst nicht eingetragen (nicht gegen DPA-Feed-Tag geprüft).
  ORCL:
    names: [Oracle, Oracle Corporation]
    sector: technology
    reddit:
      queries: [Oracle, ORCL]

  # Weitere Defense-Titel: gleicher Sektor-Kontext (Fachquellen + Keywords).
  # Ticker über Yahoo/OpenFIGI verifiziert (2026-10-22), ISIN bewusst NICHT
  # eingetragen — erst gegen DPA-Feed-Tag prüfen, dann ergänzen.
  HAG.DE:
    names: [Hensoldt]
    sector: defense
  R3NK.DE:
    names: [RENK, Renk]
    sector: defense
  OHB.DE:
    names: [OHB]
    sector: defense
  AIR.PA:
    names: [Airbus, "Airbus Defence"]
    isin: NL0000235190            # verifiziert (de.wikipedia Airbus-Infobox)
    sector: defense

feeds:                            # RSS/Atom-Feeds; enabled=false zum Deaktivieren
  # --- Rüstungsspezialisierte Quellen (Sektor-Defense) ---
  # all_items: true => Fachquelle. Die Items umgehen den Namens-/Sektor-Filter
  # und landen als [Fachquelle] im Snapshot (Budget: --fach-max, Default 10,
  # vor dem Sektor-Kontext und vor den Foren). Nur für Quellen setzen, deren
  # kompletter Feed sektor-relevant ist — nie für breite Wirtschaftspresse.
  - id: hartpunkt                   # Drohnen-/Rüstungs-Nachrichten (geprüft 2026-10-16)
    url: "https://www.hartpunkt.de/feed/"
    enabled: true
    all_items: true
  - id: esut                        # ESUT-Magazin, Mittler Report Verlag (geprüft 2026-10-16)
    url: "https://esut.de/feed/"
    enabled: true
    all_items: true
  # --- Breite Wirtschaftspresse ---
  - id: tagesschau_wirtschaft
    url: "https://www.tagesschau.de/wirtschaft/index~rss2.xml"
    enabled: true
  - id: finanzmarktwelt
    url: "https://finanzmarktwelt.de/feed/"
    enabled: true
  - id: ntv_schlagzeilen           # Top-News inkl. Wirtschaft; Sektionsfeeds tot (10/2026)
    url: "https://www.n-tv.de/rss"
    enabled: true
  - id: finanzen_net               # Akamai 403 von Datacenter-IPs (geprüft 2026-10-16)
    url: "https://www.finanzen.net/nachrichten/rss.xml"
    enabled: false
  - id: boerse_de                  # kein nutzbares öffentliches RSS von hier (geprüft 2026-10-16)
    url: "https://www.boerse.de/rss/news.xml"
    enabled: false
